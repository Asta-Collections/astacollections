    <script>
        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            try {
                // Fetch the list of files from your GitHub repository folder using GitHub's public API
                const apiURL = 'https://api.github.com/repos/Asta-Collections/astacollections/contents/content/products';
                const response = await fetch(apiURL);
                const files = await response.json();

                if (!Array.isArray(files) || files.length === 0) {
                    grid.innerHTML = '<p style="color: #888; text-align: center; grid-column: 1 / -1;">No products found in CMS yet.</p>';
                    return;
                }

                grid.innerHTML = '';

                // Loop through each product JSON file and fetch its content
                for (const file of files) {
                    if (file.name.endsWith('.json')) {
                        const productRes = await fetch(file.download_url);
                        const product = await productRes.json();

                        // Handle image field (can be a string or array if multiple)
                        let imageUrl = '';
                        if (Array.isArray(product.images) && product.images.length > 0) {
                            imageUrl = product.images[0];
                        } else if (typeof product.images === 'string') {
                            imageUrl = product.images;
                        }

                        grid.innerHTML += `
                            <div class="product-card">
                                <div class="product-image" style="background-image: url('${imageUrl}')">
                                    ${!imageUrl ? 'No Image' : ''}
                                </div>
                                <div class="product-info">
                                    <div class="product-category">${product.category || 'Collection'}</div>
                                    <div class="product-title">${product.title}</div>
                                    <div class="product-price">${product.price}</div>
                                    <a href="${product.whatsapp_link || 'https://wa.me/91XXXXXXXXXX'}" class="btn-buy" target="_blank">Inquire / Order</a>
                                </div>
                            </div>
                        `;
                    }
                }

            } catch (error) {
                console.error('Error loading products:', error);
                grid.innerHTML = '<p style="color: #888; text-align: center; grid-column: 1 / -1;">Error loading products. Please check console.</p>';
            }
        }
        loadProducts();
    </script>
